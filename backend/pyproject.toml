[project]
name = "people-counter-backend"
version = "0.3.0"
description = "HTTP/WebSocket service exposing the people counter to the dashboard."
requires-python = ">=3.10"
dependencies = [
    "people-counter-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
people-counter-api = "people_counter_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/people_counter_api"]

[tool.uv.sources]
people-counter-core = { workspace = true }
