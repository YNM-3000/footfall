[project]
name = "people-counter-core"
version = "0.3.0"
description = "Person detection, tracking, and line-crossing counting."
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "lapx>=0.5.11",
]

[project.scripts]
people-counter = "people_counter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/people_counter"]
