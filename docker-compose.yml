name: footfall

services:
  footfall:
    build: .
    image: footfall:latest
    ports:
      # Bound to localhost: the API has no authentication.
      - "127.0.0.1:8000:8000"
    volumes:
      # Uploads and the SQLite database.
      - footfall-data:/app/data
      # YOLO weights, downloaded on first run.
      - footfall-models:/app/models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  footfall-data:
  footfall-models:
