[project]
name = "people-counter"
version = "0.2.0"
description = "Camera-based people counting (YOLO + ByteTrack + virtual line crossing)."
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "lapx>=0.5.11",
]

[project.scripts]
people-counter = "people_counter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/people_counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# typing.Self needs Python 3.11; this project supports 3.10.
ignore = ["PYI034"]
