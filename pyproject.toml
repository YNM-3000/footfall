[tool.uv.workspace]
members = ["core", "backend"]

[tool.uv.sources]
footfall-core = { workspace = true }
footfall-backend = { workspace = true }

[dependency-groups]
dev = [
    "footfall-core",
    "footfall-backend",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["core/src", "backend/src"]

[tool.ruff.lint]
# typing.Self needs Python 3.11; this project supports 3.10.
ignore = ["PYI034"]
